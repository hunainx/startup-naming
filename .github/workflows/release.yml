name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build skill zip
        run: zip -r startup-naming.zip startup-naming -x '*/__pycache__/*' '*.pyc' '*/.DS_Store'
      - name: Create release with zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" startup-naming.zip \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "Upload startup-naming.zip in claude.ai (Settings → Skills), or unzip it into ~/.claude/skills/. See README for all install options."
